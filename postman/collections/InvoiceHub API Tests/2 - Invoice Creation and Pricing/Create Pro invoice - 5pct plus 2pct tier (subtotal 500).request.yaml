$kind: http-request
name: 'Create Pro invoice - 5%+2% tier (subtotal 500)'
order: 5000
method: POST
url: '{{baseUrl}}/invoices'
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{tenantB_token}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
        "customer_id": {{customerId}},
        "due_date": "2027-06-01",
        "lines": [
            {
                "description": "Pro item at 500 threshold",
                "qty": 1,
                "unit_price": 500.00
            }
        ]
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 201", function () {
          pm.response.to.have.status(201);
      });
      pm.test("Pro plan: 7% discount at subtotal 500 (5%+2%)", function () {
          const json = pm.response.json();
          pm.expect(parseFloat(json.subtotal)).to.eql(500.00);
          pm.expect(parseFloat(json.discount_rate)).to.eql(7);
          pm.expect(parseFloat(json.discount_amount)).to.eql(35.00);
      });
      pm.test("Tax is 16% of discounted amount (465)", function () {
          const json = pm.response.json();
          pm.expect(parseFloat(json.tax)).to.eql(74.40);
          pm.expect(parseFloat(json.total)).to.eql(539.40);
      });
