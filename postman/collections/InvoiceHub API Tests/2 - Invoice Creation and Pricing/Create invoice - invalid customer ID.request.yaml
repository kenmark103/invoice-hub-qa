$kind: http-request
name: 'Create invoice - invalid customer ID'
order: 7000
method: POST
url: '{{baseUrl}}/invoices'
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{token}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
        "customer_id": 999999,
        "due_date": "2027-06-01",
        "lines": [
            {
                "description": "Test item",
                "qty": 1,
                "unit_price": 100.00
            }
        ]
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 404 for unknown customer", function () {
          pm.response.to.have.status(404);
      });
      pm.test("Error code is not_found", function () {
          pm.expect(pm.response.json().code).to.eql("not_found");
      });
