$kind: http-request
name: '09 - Void Draft invoice'
order: 9000
method: POST
url: '{{baseUrl}}/invoices/{{voidInvoiceId}}/void'
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{tenantA_token}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Invoice status is void", function () {
          pm.expect(pm.response.json().status).to.eql("void");
      });
