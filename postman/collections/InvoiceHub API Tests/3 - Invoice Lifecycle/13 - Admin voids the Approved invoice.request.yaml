$kind: http-request
name: '13 - Admin voids the Approved invoice'
order: 13000
method: POST
url: '{{baseUrl}}/invoices/{{adminVoidInvoiceId}}/void'
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{tenantA_token}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Invoice status is void", function () {
          pm.expect(pm.response.json().status).to.eql("void");
      });
