$kind: http-request
name: '07 - Reject Submitted invoice'
order: 7000
method: POST
url: '{{baseUrl}}/invoices/{{rejectInvoiceId}}/reject'
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{tenantA_token}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Invoice status is rejected", function () {
          pm.expect(pm.response.json().status).to.eql("rejected");
      });
