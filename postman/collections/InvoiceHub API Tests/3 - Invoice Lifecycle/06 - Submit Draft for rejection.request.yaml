$kind: http-request
name: '06 - Submit Draft for rejection'
order: 6000
method: POST
url: '{{baseUrl}}/invoices/{{rejectInvoiceId}}/submit'
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{token}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Invoice status is submitted", function () {
          pm.expect(pm.response.json().status).to.eql("submitted");
      });
