$kind: http-request
name: '12 - Approve for admin void'
order: 12000
method: POST
url: '{{baseUrl}}/invoices/{{adminVoidInvoiceId}}/approve'
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{tenantA_token}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Invoice is approved", function () {
          pm.expect(pm.response.json().status).to.eql("approved");
      });
