$kind: http-request
name: '14 - Attempt invalid transition (void to draft)'
order: 14000
method: POST
url: '{{baseUrl}}/invoices/{{adminVoidInvoiceId}}/submit'
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{tenantA_token}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 409 for illegal transition", function () {
          pm.response.to.have.status(409);
      });
      pm.test("Error code is illegal_transition", function () {
          pm.expect(pm.response.json().code).to.eql("illegal_transition");
      });
