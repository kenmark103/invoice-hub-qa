$kind: http-request
name: 'Login - save tenantB token'
order: 4000
method: POST
url: '{{baseUrl}}/auth/login'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
        "email": "admin@beta.test",
        "password": "Passw0rd!"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Saves tenantB_token", function () {
          const json = pm.response.json();
          pm.expect(json.access_token).to.be.a("string");
          pm.collectionVariables.set("tenantB_token", json.access_token);
      });
