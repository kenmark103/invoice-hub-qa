$kind: http-request
name: 'Login - valid credentials'
order: 1000
method: POST
url: '{{baseUrl}}/auth/login'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
        "email": "staff1@acme.test",
        "password": "Passw0rd!"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Returns access_token", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("access_token");
          pm.expect(json.token_type).to.eql("bearer");
          pm.collectionVariables.set("token", json.access_token);
      });
      pm.test("User object present with role and tenant_id", function () {
          const user = pm.response.json().user;
          pm.expect(user).to.have.property("role");
          pm.expect(user).to.have.property("tenant_id");
      });
