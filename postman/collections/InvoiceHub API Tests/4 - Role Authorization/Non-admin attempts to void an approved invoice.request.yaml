$kind: http-request
name: 'Non-admin attempts to void an approved invoice'
order: 2000
method: POST
url: '{{baseUrl}}/invoices/{{approveInvoiceId}}/void'
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{token}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 403 — only admin can void approved invoice", function () {
          pm.response.to.have.status(403);
      });
      pm.test("Error code is forbidden", function () {
          pm.expect(pm.response.json().code).to.eql("forbidden");
      });
