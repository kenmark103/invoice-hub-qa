$kind: http-request
name: "Verify TenantA invoice unchanged after cross-tenant attempt"
order: 4000
method: GET
url: '{{baseUrl}}/invoices/{{tenantAInvoiceId}}'
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{tenantA_token}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200 — tenantA can still read their own invoice", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Invoice status is still draft — no mutation occurred", function () {
          pm.expect(pm.response.json().status).to.eql("draft");
      });
