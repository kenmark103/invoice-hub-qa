services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-invoicehub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-invoicehub}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-invoicehub}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8010}:8000"
    environment:
      APP_ENV: ${APP_ENV:-dev}
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-invoicehub}:${POSTGRES_PASSWORD:-change-me}@db:5432/${POSTGRES_DB:-invoicehub}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      ACTIVE_BUGS: ${ACTIVE_BUGS:-}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pg_data:
